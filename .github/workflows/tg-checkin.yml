name: TG Check-in

on:
  schedule:
    - cron: '0 4 * * *'   # 北京 12:00 触发（脚本内再随机延迟0~5小时）
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 留缓冲，低于 GitHub 的 6 小时硬限制

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Run check-in
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
        run: python tg_checkin.py
