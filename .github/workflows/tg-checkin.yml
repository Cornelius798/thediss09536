name: TG Check-in

on:
  schedule:
    - cron: '0 4 * * *'    # 北京 12:00
    - cron: '30 5 * * *'   # 北京 13:30
    - cron: '0 7 * * *'    # 北京 15:00
    - cron: '30 8 * * *'   # 北京 16:30
    - cron: '0 10 * * *'   # 北京 18:00
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Run check-in
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
        run: python tg_checkin.py
