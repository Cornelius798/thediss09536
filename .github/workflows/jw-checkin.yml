name: JustWoker 签到

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'   # 每天 UTC 00:20（北京 08:20）

concurrency:
  group: jw-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run checkin
        env:
          JW_TOKEN: ${{ secrets.JW_TOKEN }}
        run: python jw_checkin.py
