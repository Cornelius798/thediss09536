name: tabi-checkin

on:
  schedule:
    - cron: '5 0 * * *'      # UTC，即北京时间 08:05
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.48.0
      - run: playwright install --with-deps chromium
      - name: Run checkin
        env:
          TABI_ACCOUNTS: ${{ secrets.TABI_ACCOUNTS }}
        run: python checkin.py
