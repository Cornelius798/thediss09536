name: JustWoker 签到

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'    # 北京 08:20
    - cron: '0 2 * * *'     # 北京 10:00（补一次）
    - cron: '0 4 * * *'     # 北京 12:00（再补一次）

concurrency:
  group: jw-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run checkin
        env:
          JW_TOKEN_1: ${{ secrets.JW_TOKEN_1 }}
          JW_TOKEN_2: ${{ secrets.JW_TOKEN_2 }}
        run: python jw_checkin.py
