name: TabiToken 签到 (Turnstile 实验)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'   # 每天 UTC 00:30（北京 08:30），错开其他任务

concurrency:
  group: tabi-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SeleniumBase + Xvfb deps
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tabitoken checkin
        env:
          TABI_TOKEN_1: ${{ secrets.TABI_TOKEN_1 }}
          TABI_TOKEN_2: ${{ secrets.TABI_TOKEN_2 }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum python tabi_checkin.py
