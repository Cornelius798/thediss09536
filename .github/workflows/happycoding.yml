name: HappyCoding Check-in

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（GitHub cron 只有 UTC）
    - cron: '5 16 * * *'     # 北京 00:05

  workflow_dispatch:      # 手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write         # 保活步骤要提交文件

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 纯 stdlib，无需 pip install

      - name: Run HappyCoding check-in
        env:
          HAPPYCODING_TOKEN: ${{ secrets.HAPPYCODING_TOKEN }}
          # 结果推送用（可选）：缺任意一个则不推送，签到本身不受影响
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python happycoding_checkin.py

      - name: Keepalive
        # GitHub 会在仓库 60 天无活动后自动停用 scheduled workflow，
        # 每次跑完提交一个时间戳文件保持活跃。
        if: always()
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/happycoding_last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/happycoding_last_run.txt
          git diff --cached --quiet || { git commit -m "keepalive: happycoding $(date -u +%F)"; git push; }
