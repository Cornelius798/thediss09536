name: ASCS 免费 VPS 自动续期

# 续期制说明：ASCS Cloud 免费套餐每 30 天要在面板里手动点一次 Renew 确认活跃，
# 忘了续就回收。每周跑两次（周一、周四 UTC 02:17），给站点故障/登录抖动留重试空间；
# 脚本内部还有 RENEW_WINDOW_DAYS 保护：距到期超过 10 天时只读状态、不乱点。
on:
  schedule:
    - cron: "17 2 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑：只登录读状态并截图，不点击续期"
        type: boolean
        default: true
      upload_screenshots:
        description: "把截图作为 artifact 上传（注意：公开仓的 artifact 任何人可下载，默认关）"
        type: boolean
        default: false

concurrency:
  group: ascs-renew
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Playwright 与 Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 运行续期脚本
        env:
          ASCS_EMAIL: ${{ secrets.ASCS_EMAIL }}
          ASCS_PASSWORD: ${{ secrets.ASCS_PASSWORD }}
          # 定时触发时按真实续期跑；手动触发时听 dry_run 输入（默认干跑）
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          RENEW_WINDOW_DAYS: "10"
        run: python scripts/renew.py

      # 公开仓的 artifact 任何人都能下载，默认不上传；
      # 排障时在手动触发里勾上 upload_screenshots 才会执行这一步。
      - name: 上传排障截图（默认关）
        if: ${{ always() && inputs.upload_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: ascs-renew-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      # 无论续期成功/失败/未到窗口都发一条 Telegram 通知，
      # 走仓库已有的 TG_BOT_TOKEN / TG_CHAT_ID 两个 Secret（其他签到工作流也在用）。
      # 正文由 scripts/renew.py 写的 result.json 生成；不要 set -x、不要 echo secrets。
      - name: Telegram 通知结果
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF' > tg_message.txt
          import json, os
          from pathlib import Path

          data = {}
          p = Path("result.json")
          if p.exists():
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  data = {}
          status = data.get("status", "")
          tag = "【演练】" if data.get("dry_run") else ""
          lines = []
          if status == "renewed":
              lines.append(f"✅ ASCS 免费 VPS 续期成功{tag}")
          elif status == "not_due":
              lines.append(f"✅ ASCS 免费 VPS 续期：未到续期窗口{tag}")
          else:
              lines.append(f"❌ ASCS 免费 VPS 续期失败{tag}")
          if data.get("server"):
              lines.append(f"服务器：{data['server']}")
          before, after = data.get("expiry_before", ""), data.get("expiry_after", "")
          if before and after and after != before:
              lines.append(f"到期日：{before} → {after}")
          elif after or before:
              lines.append(f"到期日：{after or before}")
          if data.get("note"):
              lines.append(data["note"])
          if status not in ("renewed", "not_due"):
              step = data.get("failed_step") or "续期脚本未产出结果（可能在写 result.json 前中断）"
              lines.append(f"卡在：{step}")
          run_url = os.environ.get("RUN_URL", "")
          if run_url:
              lines.append(f"运行记录：{run_url}")
          print("\n".join(lines))
          PYEOF
          echo "----- Telegram 通知正文 -----"
          cat tg_message.txt
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text@tg_message.txt" \
            || echo "Telegram 通知发送失败（不改变本次运行结论）"
